x-contract-discovery:
  ran: '2026-08-02'
  result: no machine-readable API contract published
  detail: >-
    Butternut Box publishes no public API. api.butternutbox.com,
    developer.butternutbox.com, docs.butternutbox.com, status.butternutbox.com,
    trust.butternutbox.com and security.butternutbox.com do not resolve in DNS at all.
    OpenAPI/Swagger probes (/openapi.json, /openapi.yaml, /swagger.json, /api-docs)
    returned 404 on the marketing host and the SPA HTML shell on the app host.
    No GraphQL surface responded. No MCP server, no A2A agent card, no gRPC/protobuf,
    no published client libraries on npm, PyPI or any other registry. The public
    GitHub org (github.com/ButternutBox) holds two repositories — an engineering
    interview task starter and a small internal counter app — and no API artifacts.
    The company's robots.txt Disallows /api/, which is the Next.js internal route
    namespace for the storefront, not a public API.
  probes:
  - {kind: dns, host: api.butternutbox.com, result: NXDOMAIN}
  - {kind: dns, host: developer.butternutbox.com, result: NXDOMAIN}
  - {kind: dns, host: docs.butternutbox.com, result: NXDOMAIN}
  - {kind: dns, host: status.butternutbox.com, result: NXDOMAIN}
  - {kind: dns, host: trust.butternutbox.com, result: NXDOMAIN}
  - {kind: dns, host: security.butternutbox.com, result: NXDOMAIN}
  - {kind: openapi, url: 'https://butternutbox.com/openapi.json', status: 404}
  - {kind: openapi, url: 'https://app.butternutbox.com/openapi.json', status: 200,
    accepted: false, reason: HTML app shell}
  - {kind: openapi, url: 'https://app.butternutbox.com/swagger.json', status: 200,
    accepted: false, reason: HTML app shell}
  - {kind: graphql, url: 'https://app.butternutbox.com/graphql', status: 200, accepted: false,
