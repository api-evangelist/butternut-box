aid: butternut-box
name: Butternut Box
description: 'Butternut Box is a London-headquartered direct-to-consumer pet nutrition
  company that cooks and delivers fresh, gently-steamed dog food on a personalised
  subscription. Customers complete an online profiling wizard covering their dog''s
  breed, age, weight, activity level and health needs, and Butternut Box calculates
  a portioned meal plan from human-quality meat and vegetables, batch-cooks it at low
  temperature, freezes it, and ships it on a recurring schedule. Founded in 2016 and
  certified as a B Corporation, the company operates nine locale storefronts covering
  the United Kingdom, Ireland, the Netherlands, Belgium (Dutch and French), Germany,
  Italy, Sweden and Denmark, and runs its own production facility alongside a React
  / React Native / Ruby on Rails engineering stack. Butternut Box publishes no public
  developer API, developer portal or machine-readable specification; its customer-facing
  surfaces are the marketing site, the subscription web app and the iOS/Android apps.'
